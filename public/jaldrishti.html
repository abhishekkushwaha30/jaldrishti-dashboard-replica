function csvParse(t){const err=[],rows=[],seen={};t.split(/\r?\n/).forEach((l,i)=>{if(!l.trim())return;const a=l.split(',').map(x=>x.trim());if(i==0&&/^zone$/i.test(a[0]))return;const n=i+1;

const k=a[0]+'|'+h;if(seen[k])return err.push(`Line ${n}: duplicate row for ${a[0]} hour ${h} (first on line ${seen[k]})`);seen[k]=n;rows.push({z:a[0],h,f:v[0],c:v[1],p:v[2]})});
const ok=rows.length,by={};rows.forEach(r=>(by[r.z]=by[r.z]||[]).push(r));const good=[];
for(const z in by){if(by[z].length==24)good.push(...by[z]);else{const m=[...Array(24).keys()].filter(h=>!by[z].some(r=>r.h==h));err.push(`Zone ${z} excluded: missing hours ${m.join(', ')}`)}}
return{rows:good,err,ok}}
